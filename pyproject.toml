[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-vc-director"
version = "0.1.0"
description = "Scenario-to-scene planning and deterministic H3 Context Loop compilation"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
inference = ["llama-cpp-python>=0.3"]
vision = ["Pillow>=10", "numpy>=1.24"]

[project.scripts]
vc-director = "vc_director.tools.cli:main"

# setup.py maps the MV-style source directories to the vc_director namespace.

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "ASSET_LICENSES.md"]
