<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1530" viewBox="0 0 2200 1530" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">ComfyUI-VC-Director 全体ブロック図 — Draft 0.3</title>
<desc id="diagram-description">同じワークフローで言語生成と動画生成を切り替える構成。共有素材とシナリオからGemma4が時刻付きシーンEMDを生成し、Pythonが発話保護、人物参照、時間契約を処理してJSONを保存する。動画モードではJSONを読み、VC Scene Ref2VAとContext Loopで映像および音声を生成する。</desc>
